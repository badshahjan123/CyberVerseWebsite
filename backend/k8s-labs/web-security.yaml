apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-lab-web-security
  labels:
    app: cyberverse-lab
    lab-id: web-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyberverse-lab
      lab-id: web-security
  template:
    metadata:
      labels:
        app: cyberverse-lab
        lab-id: web-security
    spec:
      containers:
        - name: web-security-container
          image: badshahjan/web-vuln-advanced:latest
          imagePullPolicy: IfNotPresent # Optimized for Docker Desktop
          ports:
            - containerPort: 7681
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-lab-web-security-service
  labels:
    lab-id: web-security
spec:
  selector:
    app: cyberverse-lab
    lab-id: web-security
  ports:
    - protocol: TCP
      port: 8087
      targetPort: 7681
      nodePort: 32235
  type: NodePort
